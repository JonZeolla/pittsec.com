---
name: Test

on: pull_request

defaults:
  run:
    shell: 'bash --noprofile --norc -Eeuo pipefail {0}'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # trufflehog (pre-commit) scans the commits since origin/main
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v2
      - name: Install Task
        uses: arduino/setup-task@v2
      - name: Lint
        run: task -v lint
      - name: Test the site
        run: task -v test
